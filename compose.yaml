services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: wt_lab8
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wt_lab8"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "10000:10000"
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=wt_lab8;Username=postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
volumes:
  pgdata:
